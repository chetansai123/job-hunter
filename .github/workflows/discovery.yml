name: 24/7 Job & Post Discovery

# Free GitHub-hosted runner does the scanning while your Mac is off.
#   light scan  every 30 minutes → job APIs (Greenhouse, Lever, Ashby, Workday, remote boards …) + HN/Reddit posts   ~3 min
#   full scan   every 3 hours    → + LinkedIn jobs, company career pages (Playwright browser), LinkedIn post search  ~15 min
# GitHub's own scheduler fires erratically (observed: every 5-8 h), so an external free cron (cron-job.org) calls the
# workflow_dispatch API every 30 min (light) and every 3 h (full). The schedule above is only a backup.
# Results go to the `data` branch (one commit, history discarded) so the repo never bloats; the dashboard's
# "Sync Cloud" button / auto-sync merges them into your local database without touching Applied/Saved marks.
on:
  schedule:
    - cron: '3 * * * *'         # backup only: hourly light scan (GitHub's scheduler is unreliable; cron-job.org triggers every 30 min)
    - cron: '17 */3 * * *'      # full scan every 3 hours (+ LinkedIn jobs, career pages in a real browser, LinkedIn post search)  ~15 min
    - cron: '41 21 * * *'       # daily discovery (03:11 IST): find new companies + their job boards. Full scans also run it if a day was missed.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        type: choice
        options: [light, full, discovery]
        default: full

permissions:
  contents: write
  actions: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 */3 * * *' && 'full' || (github.event.schedule == '41 21 * * *' && 'discovery' || 'light')) }}
      SCAN_INTERVAL_MINUTES: '0'
      AUTO_SYNC: '0'
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
      EXCLUDE_COMPANIES: ${{ secrets.EXCLUDE_COMPANIES }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the database from the data branch
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:jobs.db > jobs.db                        # must succeed — never scan from an empty DB
            [ "$(stat -c %s jobs.db)" -gt 100000 ] || { echo "restored jobs.db is suspiciously small — aborting"; exit 1; }
          else
            echo "no data branch yet — starting empty"
          fi
          ls -la jobs.db 2>/dev/null || true

      - name: Install Playwright browser (full scans only)
        if: env.MODE != 'light'
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Cache firecrawl-local
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/firecrawl-local
          key: firecrawl-local-0.1.0-${{ runner.os }}

      - name: Start firecrawl-local (free page reader using the runner's Chrome; search stays off — that part is paid cloud only)
        continue-on-error: true          # a failure here only means the few JavaScript-heavy sources return nothing this run
        run: |
          if ! command -v firecrawl-local >/dev/null; then
            rustup toolchain install stable --profile minimal >/dev/null 2>&1 || true
            cargo +stable install firecrawl-local --version 0.1.0 --locked || cargo +stable install firecrawl-local --version 0.1.0
          fi
          nohup firecrawl-local serve --port 3002 > /tmp/firecrawl.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3002/health >/dev/null && { echo "firecrawl-local is up"; break; }; sleep 1; done
          curl -s -X POST http://127.0.0.1:3002/v2/scrape -H 'Content-Type: application/json' \
               -d '{"url":"https://jsgurujobs.com/jobs/?page=1","formats":["markdown"]}' | head -c 300; echo

      - name: Migrate database
        run: python job_hunter.py --init-db

      - name: Scan (${{ env.MODE }})
        id: scan
        timeout-minutes: 50            # a slow scan stops here, so the steps below still save what it found
        run: python -u job_hunter.py --scan --mode "$MODE"

      - name: Publish database to the data branch
        if: (success() || failure()) && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')   # also after a timed-out scan
        run: |
          [ -f jobs.db ] || exit 0
          [ "$(stat -c %s jobs.db)" -gt 100000 ] || { echo "jobs.db too small — not publishing"; exit 1; }
          python -c "import sqlite3,sys; r=sqlite3.connect('jobs.db').execute('pragma integrity_check').fetchone()[0]; print('db', r); sys.exit(r!='ok')"
          rm -rf /tmp/pub && mkdir /tmp/pub && cp jobs.db /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name  "job-hunter[bot]"
          git config user.email "job-hunter[bot]@users.noreply.github.com"
          git add jobs.db
          git commit -q -m "jobs.db $(date -u +%FT%TZ) (${MODE})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          echo "published $(du -h jobs.db | cut -f1)"

      - name: Build the dashboard and publish it to the site branch (GitHub Pages serves it)
        if: (success() || failure()) && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')
        run: |
          [ -n "$DASH_PASSWORD" ] && pip install --quiet cryptography
          python job_hunter.py --export-static /tmp/site
          cd /tmp/site
          git init -q -b site
          git config user.name  "job-hunter[bot]"
          git config user.email "job-hunter[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          echo "site branch published"

      - name: Keep the schedule alive (GitHub pauses scheduled workflows after 60 days of no repo activity)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/discovery.yml/enable" || true
