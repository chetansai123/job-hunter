name: 24/7 Job & Post Discovery

on:
  schedule:
    # Runs every 30 minutes in the cloud 24/7 (even with laptop powered off)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run discovery scan across all global sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 job_hunter.py --init-db
          python3 job_hunter.py --scan

      - name: Commit and push updated jobs.db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          if git diff --staged --quiet; then
            echo "No new jobs found in this run."
          else
            git commit -m "Auto-discovery: updated jobs.db [skip ci]"
            git push
          fi
