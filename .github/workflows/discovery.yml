name: 24/7 Job & Post Discovery

# Free GitHub-hosted runner does the scanning while your Mac is off.
#   light scan  every 4 hours  → job APIs only (Greenhouse, Lever, Ashby, Workday, remote boards, HuntYourTribe…)  ~5 min
#   full scan   twice a day    → + LinkedIn jobs, company career pages (Playwright browser), HN/Reddit posts, Apify  ~15 min
# Results go to the `data` branch (one commit, history discarded) so the repo never bloats; the dashboard's
# "Sync Cloud" button / auto-sync merges them into your local database without touching Applied/Saved marks.
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'   # light — 05:47, 09:47, 13:47, 17:47, 21:47, 01:47 IST
    - cron: '47 5,17 * * *'             # full  — 11:17 and 23:17 IST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        type: choice
        options: [light, full]
        default: full

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '47 5,17 * * *' && 'full' || 'light') }}
      SCAN_INTERVAL_MINUTES: '0'
      AUTO_SYNC: '0'
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore the database from the data branch
        run: |
          git fetch --depth=1 origin data 2>/dev/null && git show origin/data:jobs.db > jobs.db || echo "no data branch yet — starting empty"
          ls -la jobs.db 2>/dev/null || true

      - name: Install Playwright browser (full scans only)
        if: env.MODE == 'full'
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Migrate database
        run: python job_hunter.py --init-db

      - name: Scan (${{ env.MODE }})
        run: python -u job_hunter.py --scan --mode "$MODE"

      - name: Publish database to the data branch
        if: always()
        run: |
          [ -f jobs.db ] || exit 0
          rm -rf /tmp/pub && mkdir /tmp/pub && cp jobs.db /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name  "job-hunter[bot]"
          git config user.email "job-hunter[bot]@users.noreply.github.com"
          git add jobs.db
          git commit -q -m "jobs.db $(date -u +%FT%TZ) (${MODE})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          echo "published $(du -h jobs.db | cut -f1)"

      - name: Build the encrypted dashboard and publish it to the site branch (Vercel serves this branch)
        if: always() && env.DASH_PASSWORD != ''
        run: |
          pip install --quiet cryptography
          python job_hunter.py --export-static /tmp/site
          cd /tmp/site
          git init -q -b site
          git config user.name  "job-hunter[bot]"
          git config user.email "job-hunter[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          echo "site branch published"
