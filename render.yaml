services:
  - type: web
    name: job-hunter-dashboard
    runtime: python
    buildCommand: "python3 job_hunter.py --init-db"
    startCommand: "python3 job_hunter.py --serve --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SCAN_INTERVAL_MINUTES
        value: 30
      - key: GEMINI_API_KEY
        sync: false
